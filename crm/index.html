<!DOCTYPE html>
<html lang="uk">
<head>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">
    <!-- Заборона масштабування для відчуття нативного додатка -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Запис до кабінету</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        
        <header class="app-header">
            <h1 class="brand-title">Laser by Nadiia</h1>
            <p class="brand-subtitle">Beauty & Wellness Studio</p>
        </header>

        <!-- Блок ШІ-асистента -->
        <div class="ai-card">
            <button type="button" id="dictateBtn" class="btn-voice">
                <span class="icon">🎙</span>
            </button>
            <div id="voiceStatus" class="status-text">ready</div>
        </div>

        <form id="bookingForm" class="booking-form">
            <div class="input-group">
                <select id="masterName" required>
                    <option value="Nadiia">Nadiia</option>
                    <option value="Sofiia">Sofiia</option>
                </select>
                <label for="masterName" class="active">Майстер</label>
            </div>
            
            <div class="input-group">
                <input type="text" id="clientName" placeholder=" " required>
                <label for="clientName">Ім'я клієнта та послуга</label>
            </div>

            <!-- ДАТА, ЧАС ТА ХВИЛИНИ В ОДНОМУ РЯДКУ -->
            <div class="form-row">
                <div class="input-group flex-date">
                    <input type="date" id="date" required>
                    <label for="date" class="active">Дата</label>
                </div>
                
                <div class="input-group flex-time">
                    <input type="time" id="startTime" required>
                    <label for="startTime" class="active">Час</label>
                </div>
                
                <div class="input-group flex-dur">
                    <input type="number" id="duration" value="60" min="15" step="15" required>
                    <label for="duration" class="active">Хв</label>
                </div>
            </div>

            <div class="input-group">
                <textarea id="description" rows="3" placeholder=" "></textarea>
                <label for="description">Побажання / зони</label>
            </div>

            <button type="submit" class="btn-submit">
                <span>Внести до Календаря</span>
            </button>
        </form>
    </div>

    <script src="ai.js" defer></script>
    <script src="app.js" defer></script>
</body>
</html>
